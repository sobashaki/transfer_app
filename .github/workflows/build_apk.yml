name: Build Flutter APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
      - name: Create Clean Flutter Project and Build
        run: |
          flutter create temp_app --org com.example.transferapp
          
          if [ -f "lib/main.dart" ]; then
            cp lib/main.dart temp_app/lib/main.dart
          elif [ -f "transfer_app/lib/main.dart" ]; then
            cp transfer_app/lib/main.dart temp_app/lib/main.dart
          fi

          cd temp_app

          # كتابة ملف pubspec.yaml بشكل نظيف ومباشر لتجنب أي أخطاء
          cat << 'EOF' > pubspec.yaml
          name: temp_app
          description: A new Flutter project.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_phone_direct_caller: ^2.1.1
            shared_preferences: ^2.2.0

          flutter:
            uses-material-design: true
          EOF

          # تعديل الحد الأدنى لأندرويد إلى 21
          file="android/app/build.gradle"
          if [ -f "$file" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' "$file"
            sed -i 's/minSdkVersion 16/minSdkVersion 21/g' "$file"
          fi

          flutter pub get
          flutter build apk --release --verbose
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
