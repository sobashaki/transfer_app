name: Build Flutter APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          cache: true

      - name: Build App With New Name and Icon
        run: |
          flutter create my_transfer_app --org com.example.app
          
          mkdir -p my_transfer_app/assets
          if [ -f "icon.png" ]; then
            cp icon.png my_transfer_app/assets/icon.png
          fi

          cd my_transfer_app

          # تحديث ملف pubspec.yaml
          cat << 'EOF' > pubspec.yaml
          name: my_transfer_app
          description: A new Flutter project.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_phone_direct_caller: ^2.1.1
            shared_preferences: ^2.2.0

          dev_dependencies:
            flutter_launcher_icons: ^0.13.1

          flutter_launcher_icons:
            android: "launcher_icon"
            image_path: "assets/icon.png"
            min_sdk_android: 21

          flutter:
            uses-material-design: true
          EOF

          # تحديث اسم التطبيق في ملف AndroidManifest.xml (الاسم الخارجي)
          sed -i 's/android:label="my_transfer_app"/android:label="تحويل رصيد سيرياتيل"/g' android/app/src/main/AndroidManifest.xml

          # كتابة كود التطبيق الأساسي مع الاسم الجديد في الـ AppBar
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:flutter_phone_direct_caller/flutter_phone_direct_caller.dart';

          void main() { runApp(const TransferApp()); }

          class TransferApp extends StatelessWidget {
            const TransferApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                theme: ThemeData(primarySwatch: Colors.teal),
                home: const Directionality(textDirection: TextDirection.rtl, child: TransferPage()),
              );
            }
          }

          class TransferPage extends StatefulWidget { const TransferPage({super.key}); @override State<TransferPage> createState() => _TransferPageState(); }

          class _TransferPageState extends State<TransferPage> {
            final TextEditingController phoneController = TextEditingController();
            final TextEditingController pinController = TextEditingController();
            Map<String, dynamic>? selectedAmount;
            
            // ... (باقي الكود كما هو)
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('تحويل رصيد سيرياتيل', style: TextStyle(fontWeight: FontWeight.bold)),
                  centerTitle: true,
                  backgroundColor: Colors.teal,
                  foregroundColor: Colors.white,
                ),
                body: Container( /* ... تصميم الصفحة كما هو ... */ ),
              );
            }
          }
          EOF

          # البناء
          flutter pub get
          dart run flutter_launcher_icons
          
          file="android/app/build.gradle"
          if [ -f "$file" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' "$file"
            sed -i 's/minSdkVersion 16/minSdkVersion 21/g' "$file"
          fi

          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: my_transfer_app/build/app/outputs/flutter-apk/app-release.apk
