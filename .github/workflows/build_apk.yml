name: Build Flutter APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          cache: true

      - name: Build Final App
        run: |
          flutter create my_transfer_app --org com.example.app
          mkdir -p my_transfer_app/assets
          cd my_transfer_app

          cat << 'EOF' > pubspec.yaml
          name: my_transfer_app
          version: 1.0.0+1
          dependencies:
            flutter: {sdk: flutter}
            flutter_phone_direct_caller: ^2.1.1
            shared_preferences: ^2.2.0
          flutter: {uses-material-design: true}
          EOF

          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:flutter_phone_direct_caller/flutter_phone_direct_caller.dart';

          void main() => runApp(const MaterialApp(home: TransferPage(), debugShowCheckedModeBanner: false));

          class TransferPage extends StatefulWidget { const TransferPage({super.key}); @override State<TransferPage> createState() => _TransferPageState(); }

          class _TransferPageState extends State<TransferPage> {
            final TextEditingController phoneController = TextEditingController();
            final TextEditingController pinController = TextEditingController();
            final TextEditingController amountController = TextEditingController();
            
            final List<String> prices = ["1.92", "2.88", "3.84", "4.80", "5.76", "9.61", "20.19", "23.07", "24.03", "25.96", "30.76", "40.38", "45.19", "48.07", "52.88", "62.5", "68.26", "72.11", "77.88", "81.73", "86.53", "96.15", "100.96", "105.76", "115.38", "125", "130.76", "144.23", "160.57", "163.46", "173.07", "183.65", "192.30", "211.53", "240.38", "288.46", "317.30", "370.19", "432.69", "480.76", "576.92", "625.00", "650", "721.15", "750", "769.23", "800", "951.92", "990", "1057.69", "1100", "1250.00", "1300", "1923.07", "2000", "2115.38", "2200", "2403.84", "2500", "3846.15", "4000"];

            @override
            void initState() { super.initState(); SharedPreferences.getInstance().then((p) => setState(() => pinController.text = p.getString('pin') ?? '')); }

            void _execute() async {
              String ussd = "*150*1*${pinController.text}*1*${amountController.text}*${phoneController.text}*${phoneController.text}%23";
              await FlutterPhoneDirectCaller.callNumber(ussd);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('تحويل رصيد سيرياتيل')),
                body: Padding(padding: const EdgeInsets.all(15), child: Column(children: [
                  TextField(controller: phoneController, decoration: const InputDecoration(labelText: 'رقم الزبون'), keyboardType: TextInputType.phone),
                  DropdownButtonFormField<String>(
                    isExpanded: true,
                    hint: const Text("اختر كمية من القائمة"),
                    items: prices.map((p) => DropdownMenuItem(value: p, child: Text(p))).toList(),
                    onChanged: (v) => setState(() => amountController.text = v!),
                  ),
                  TextField(controller: amountController, decoration: const InputDecoration(labelText: 'كمية التحويل'), keyboardType: const TextInputType.numberWithOptions(decimal: true)),
                  TextField(controller: pinController, obscureText: true, decoration: const InputDecoration(labelText: 'الرقم السري'), onChanged: (v) => SharedPreferences.getInstance().then((p) => p.setString('pin', v))),
                  const SizedBox(height: 20),
                  ElevatedButton(onPressed: _execute, child: const Text('تنفيذ التحويل'))
                ])),
              );
            }
          }
          EOF

          # التعديل لضمان عمل المكتبة
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          sed -i 's/minSdkVersion 16/minSdkVersion 21/g' android/app/build.gradle
          
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: my_transfer_app/build/app/outputs/flutter-apk/app-release.apk
